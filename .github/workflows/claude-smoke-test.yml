# Isolated smoke test for the programmatic Claude Code invocation itself -
# does claude-code-action authenticate with `CLAUDE_CODE_OAUTH_TOKEN` and
# actually run a turn against this repo? Deliberately separate from
# scan.yml, which conflates that question with market-hours guards, scout
# dispatch, and the decide pipeline. This proves nothing about trading
# logic - only that the wiring (secret -> action -> model -> tool call)
# works end to end.
name: claude-smoke-test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # claude-code-action requires this regardless of auth
                     # method - see scan.yml's comment for the detail

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            Run `python mw.py clock` with the Bash tool. Reply with exactly
            its JSON output and nothing else - no preamble, no markdown
            fence, no commentary. This confirms the model actually ran a
            real command against this checkout, not just that the action
            authenticated.
          claude_args: |
            --model claude-sonnet-5 --allowedTools "Bash(python mw.py clock)"
